<div class="container mt-5">
    <h1 class="mb-4">My Profile</h1>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Profile Information</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label"><strong>Name</strong></label>
                        <p id="userName" class="form-control-plaintext">Loading...</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>Email</strong></label>
                        <p id="userEmail" class="form-control-plaintext">Loading...</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>Phone</strong></label>
                        <p id="userPhone" class="form-control-plaintext">Loading...</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>Role</strong></label>
                        <p id="userRole" class="form-control-plaintext"><span class="badge bg-info">Loading...</span></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>Member Since</strong></label>
                        <p id="userJoined" class="form-control-plaintext">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../utils/constants.js"></script>
<script src="../utils/utils.js"></script>
<script src="../utils/rest-client.js"></script>
<script>
    $(document).ready(function() {
        const token = localStorage.getItem("user_token");
        const decodedToken = Utils.parseJwt(token);
        
        if (decodedToken && decodedToken.user) {
            const user = decodedToken.user;
            $('#userName').text(user.name || 'N/A');
            $('#userEmail').text(user.email || 'N/A');
            $('#userPhone').text(user.phone || 'N/A');
            $('#userRole').html(`<span class="badge ${user.role === 'admin' ? 'bg-danger' : 'bg-info'}">${user.role}</span>`);
            $('#userJoined').text(user.created_at ? user.created_at.split(' ')[0] : 'N/A');
        }
    });
</script>
