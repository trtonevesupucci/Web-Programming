<div class="container mt-5">
    <h1 class="mb-4">Users Management</h1>
    <table id="users-table" class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="../../utils/constants.js"></script>
<script src="../../utils/utils.js"></script>
<script src="../../utils/rest-client.js"></script>
<script>
    $(document).ready(function() {
        RestClient.get('users', function(data) {
            let tbody = $('#users-table tbody');
            tbody.empty();
            data.forEach(user => {
                let roleBadge = user.role === 'admin' ? 'badge-danger' : (user.role === 'staff' ? 'badge-info' : 'badge-secondary');
                
                tbody.append(`
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.phone}</td>
                        <td><span class="badge ${roleBadge}">${user.role}</span></td>
                        <td>${user.created_at ? user.created_at.split(' ')[0] : 'N/A'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary">Edit</button>
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </td>
                    </tr>
                `);
            });
        }, function(err) {
            toastr.error('Failed to load users');
        });
    });
</script>
