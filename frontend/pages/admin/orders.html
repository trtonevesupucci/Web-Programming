<div class="container mt-5">
    <h1 class="mb-4">Orders Management</h1>
    <table id="orders-table" class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="../../utils/constants.js"></script>
<script src="../../utils/utils.js"></script>
<script src="../../utils/rest-client.js"></script>
<script>
    $(document).ready(function() {
        RestClient.get('orders', function(data) {
            let tbody = $('#orders-table tbody');
            tbody.empty();
            data.forEach(order => {
                let statusBadge = 'badge-warning';
                if (order.status === 'completed') statusBadge = 'badge-success';
                if (order.status === 'cancelled') statusBadge = 'badge-danger';
                
                tbody.append(`
                    <tr>
                        <td>#${order.id}</td>
                        <td>${order.user_id || 'N/A'}</td>
                        <td>${order.order_date || 'N/A'}</td>
                        <td>$${parseFloat(order.total_amount || 0).toFixed(2)}</td>
                        <td><span class="badge ${statusBadge}">${order.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-info">View</button>
                            <button class="btn btn-sm btn-primary">Update</button>
                        </td>
                    </tr>
                `);
            });
        }, function(err) {
            toastr.error('Failed to load orders');
        });
    });
</script>
