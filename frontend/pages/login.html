<div class="container">
    <div class="section">
        <div style="max-width: 500px; margin: 0 auto;">
            <h1 class="text-center mb-4">Login</h1>
            
            <div class="card">
                <div class="card-body">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: bold;">Sign up here</a></p>
                    </div>
                    
                    <div class="mt-3 p-2" style="background-color: var(--bg-light); border-radius: 5px;">
                        <p class="text-center" style="margin: 0; font-size: 0.9rem;">
                            <strong>Demo Accounts:</strong><br>
                            Admin: testadmin@test.com / password123<br>
                            Customer: testcustomer@test.com / password123
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
<script src="utils/constants.js"></script>
<script src="utils/utils.js"></script>
<script src="utils/rest-client.js"></script>
<script src="services/user-service.js"></script>
<script>
  UserService.init();
</script>
